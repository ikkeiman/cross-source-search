# search（検索 API と画面）+ fake-kintone（偽 kintone）+ ollama（要約と埋め込み）
#
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct && docker compose exec ollama ollama pull bge-m3
#   docker compose exec search uv run --no-sync python -m xsearch ingest     # 取り込み（日次で回す想定）
#   open http://localhost:8000
#
# Ollama を省くと、要約は先頭抜粋・埋め込みはハッシュに自動で切り替わる（動作確認用）。
# 本物の kintone / Dropbox に向けるときは .env を作り、SOURCES と各トークンを設定する。

services:
  search:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FAKE_KINTONE_URL: http://fake-kintone:8002
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_FOLDER_PATH: /app/sample_data/files
      DATA_DIR: /data
    volumes:
      - search-data:/data
    depends_on:
      - fake-kintone

  fake-kintone:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "xsearch", "fake-kintone", "--host", "0.0.0.0"]
    ports:
      - "8002:8002"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  search-data:
  ollama-models:
